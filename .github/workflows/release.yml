name: Release

on:
  # Support manually pushing a new release
  workflow_dispatch: {}
  # Trigger when a release is published
  release:
    types: [published]

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Publish to NPM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Configure Socket Firewall
        uses: workos/setup-socket-firewall@ca93dd8aa351f54f4729fe3377a9be23c631c25d # v1
        with:
          token: ${{ secrets.PUBLIC_SOCKET_FIREWALL_TOKEN }}

      - name: Install Dependencies
        run: |
          npm install

      - name: Restore public registry before build and publication
        uses: workos/setup-socket-firewall/teardown@ca93dd8aa351f54f4729fe3377a9be23c631c25d # v1

      - name: Build project
        run: |
          npm run build

      - name: Push Release
        if: ${{ !github.event.release.prerelease }}
        run: |
          npm publish --tag latest --access=public --provenance

      - name: Push Pre-Release
        if: ${{ github.event.release.prerelease }}
        run: |
          npm publish --tag next --access=public --provenance
